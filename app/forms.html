<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style/forms.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=book_ribbon" />
    <script src="./scripts/menu.js" defer></script>
    <script src="./scripts/form.js" defer></script>
</head>

<body>
    <div id="container">
        <header>
            <img src="./images/logodeaviao.png" alt="" />
            <div class="toggle"></div>
            <a class="link-do-cabecalho" href="./index.html">Viajei</a>
            <a class="link-do-cabecalho" href="./about.html">Sobre</a>
            <a class="link-do-cabecalho" href="./forms.html">História</a>
        </header>

        <section>
            <form id="post-form">

                <h1>História <span class="material-symbols-outlined">
                        book_ribbon
                    </span></h1>

                <label for="usuario">Nome </label> (ex: Felipe da Silva)
                <input type="text" id="usuario" name="usuario" placeholder="Felipe da Silva">

                <label for="titulo">Email</label> (ex: felipedasilva@gmail.com)
                <input type="email" name="email" id="email" placeholder="felipedasilva@gmail.com">

                <label for="título">Título</label> (ex: Título da história)
                <input type="text" id="titulo" name="titulo" placeholder="A vida é carnaval">

                <label for="história">História</label>
                <textarea name="historia" id="historia" cols="30" rows="10" placeholder="Minha fruta favorita..."> </textarea>

                <button type="submit"> Enviar </button>

            </form>
        </section>

        <footer>
            <div id="historias"></div>
        </footer>

    </div>
</body>

</html>
